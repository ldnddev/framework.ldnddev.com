<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dd-blockquote demo - dd-framework</title>
<link rel="stylesheet" href="/assets/css/style.min.css">
<style>
  body{margin:0;padding:0}
  /* Demo isolation: each iframe is its own document, so headings here are scoped locally. */
</style>
</head>
<body class="dd-g">
<main aria-label="dd-blockquote live example">
<blockquote class="dd-blockquote">
  <div class="dd-blockquote__content dd-g" data-sal="fade">
    <div class="dd-blockquote__icon"><i class="fa-regular fa-message-quote"></i></div>
    <div class="dd-blockquote__person dd-g l-box">
      <div class="dd-blockquote__image">
        <img src="https://dummyimage.com/400x400/000/fff" alt="First Name Last Name" />
      </div>
      <div class="dd-blockquote__name-title">
        <span class="dd-blockquote__name">First Name Last Name</span>
        <span class="dd-blockquote__title">, Title</span>
      </div>
      <div class="dd-blockquote__comment">
        <p>Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.</p>
      </div>
    </div>
  </div>
</blockquote>
<script type="application/ld+json">
{
  "@context": "http://schema.org/",
  "@type": "Quotation",
  "creator": {
    "@type": "Person",
    "name": "PERSONS NAME GOES HERE"
  },
  "text": "COMMENT COPY GOES HERE"
}
</script>

</main>
  <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous" defer></script>
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
